Root: /data/data/com.termux/files/home/Shortmeshi. Package: toon-studio v1.0.0, private, ESM.

14. PWA / CACHING
- manifest.webmanifest: name &quot;Toon Studio&quot;, short &quot;ToonStudio&quot;, display fullscreen with display_override [fullscreen, standalone], theme/background #0b0c10, 192/512 icons (&quot;any maskable&quot;), category graphics/design/productivity, one shortcut &quot;New Project&quot; -&gt; /?new=true.
- sw-register.js registers ./sw.js scope ./ on window.load. sw.js is DELIBERATELY NETWORK-ONLY: install -&gt; skipWaiting, activate -&gt; clients.claim, fetch -&gt; no respondWith. It exists only so Chrome offers &quot;Install app / Add to Home screen&quot;; there is NO offline cache and no caching must be added (a stale-cache bug happened before).
- Strict CSP: default-src &#x27;self&#x27;; script-src &#x27;self&#x27; &#x27;wasm-unsafe-eval&#x27;; style-src &#x27;self&#x27; &#x27;unsafe-inline&#x27;; img-src &#x27;self&#x27; data: blob: https:; font-src &#x27;self&#x27; data:; connect-src &#x27;self&#x27; https: http:; media-src &#x27;self&#x27; blob: data:; worker-src &#x27;self&#x27; blob:; object-src &#x27;none&#x27;; base-uri &#x27;self&#x27;; form-action &#x27;self&#x27;. All JS therefore lives in external files.

16. COMPANION SYSTEM — OpenCode Uploader (port 3000, SEPARATE from the app on 4173)
- /data/data/com.termux/files/home/opencode-uploader: Express 5 + Multer 2 local file bridge, loopback-only 127.0.0.1:3000, no build step/CDN/database, mobile-first dark/light UI.
- Purpose: upload any file (images, video, audio, PDF, SVG, archives, text) from the browser straight into the active OpenCode workspace so the agent can read it. This is how the user sends reference images — it is confirmed working (history.json + /api/info ok + raw file served 200).
- UI: giant &quot;+&quot; card, drag &amp; drop, paste, search, XHR progress bars with cancel, thumbnails, copy path, open, download, delete, toasts, theme toggle. Up to 2 GiB per file, 20 files per request.
- API: GET /api/info (version, pid, target, limits, uptime, counts), GET /api/history, POST /api/upload (multipart &quot;files&quot;, requires X-Uploader:1), POST /api/target (retarget running instance), GET /api/file/:id/raw (Range support, ?download=1), DELETE /api/file/:id. Mutation routes require X-Uploader:1 plus same-origin Origin/Sec-Fetch-Site.
- Lifecycle: OpenCode V2 plugin integrations/opencode-plugin.ts starts it with UPLOAD_DIR = active workspace and a PARENT_PID watchdog; ~/.bashrc shell hook starts it for interactive Termux shells; health-checked single instance; 1.5s watchdog exits on parent death and removes pid file; plugin re-probes every 5s. CLI: uploader start/status/open/logs/restart/stop/doctor. Autostart toggle OPENCODE_UPLOADER_AUTOSTART=0.
- Config env: PORT=3000, HOST=127.0.0.1, UPLOAD_DIR, MAX_FILE_SIZE=2147483648, MAX_FILES=20, PARENT_PID, OPENCODE_UPLOADER_HOME, OPENCODE_UPLOADER_NODE, OPENCODE_UPLOADER_DATA, OPENCODE_UPLOADER_AUTOSTART=1.
- Uploaded files land in /data/data/com.termux/files/home with timestamped names; history in opencode-uploader/data/history.json. Target directory is never served statically; files are reachable only by history ID.

- Speed (gauge) — open speed drawer: .25x/.5x/1x/1.5x/2x/4x/8x + slider.
- Reverse (back arrows) — play the clip backwards.
- Freeze (snowflake) — hold the current frame for 2 seconds.
- Duplicate (two squares) — copy the clip onto a new row.
- Copy / Paste (two sheets / clipboard) — copy clip settings and paste.
- Opacity (half circle) — fade the clip layer.
- Replace (swap arrows) — swap the clip&#x27;s media.
- Delete (trash, danger color) — remove the clip.
- Save (disk) — save this clip setup into the project.
- Camera Track (target on camera) — bind camera motion to the clip.
- View Cam (eye in camera) — jump to that camera view.
